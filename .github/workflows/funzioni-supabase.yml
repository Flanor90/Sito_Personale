name: Pubblica le funzioni Supabase

# Quando cambia il codice del server (supabase/functions/), lo pubblica
# su Supabase da solo, così una modifica non resta solo su GitHub.
# Usa il segreto SUPABASE_ACCESS_TOKEN del repository (token personale
# dell'account, da supabase.com/dashboard/account/tokens, inizia con sbp_).
#
# --no-verify-jwt: "api" riceve i moduli del sito, che non hanno login;
# "admin" controlla da sé l'utente con auth.getUser. Con la verifica JWT
# di Supabase i moduli del sito smetterebbero di funzionare.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - ".github/workflows/funzioni-supabase.yml"
  workflow_dispatch:

jobs:
  pubblica:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Controlla che il token ci sia
        if: env.SUPABASE_ACCESS_TOKEN == ''
        run: |
          echo "::error::Manca il segreto SUPABASE_ACCESS_TOKEN (GitHub → Settings → Secrets and variables → Actions)."
          exit 1
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: sh supabase/sync-lib.sh
      # Le migrazioni nuove si applicano con l'API di gestione di Supabase,
      # con lo stesso token. Sono scritte per poter girare più volte.
      - name: Applica le migrazioni idempotenti
        run: |
          for f in supabase/migrations/20261118150000_prenotazioni.sql supabase/migrations/20261119100000_prenotazioni_calendario.sql; do
            echo "Applico $f"
            jq -Rs '{query: .}' "$f" > /tmp/q.json
            curl -fsS -X POST "https://api.supabase.com/v1/projects/ynmxgdcikqlgcupfszza/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              --data @/tmp/q.json > /dev/null
          done
      - run: supabase functions deploy api --project-ref ynmxgdcikqlgcupfszza --no-verify-jwt --yes
      - run: supabase functions deploy admin --project-ref ynmxgdcikqlgcupfszza --no-verify-jwt --yes
      - name: Controlla che il sito risponda
        run: curl -fsS https://ynmxgdcikqlgcupfszza.supabase.co/functions/v1/api/ping
